<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文献检索 – 可靠性与精度保持性</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: sans-serif; max-width: 1300px; margin: 20px auto; padding: 0 15px; }
    h1 { margin-bottom: 5px; }
    .filters { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
    .filter-group { display: flex; flex-direction: column; }
    label { font-weight: bold; margin-bottom: 4px; font-size: 0.9em; }
    select, input, button { padding: 6px; font-size: 14px; }
    .button-row { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    #results { list-style: none; padding: 0; }
    .paper { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .paper h3 { margin: 0 0 5px 0; }
    .meta { font-size: 0.9em; color: #555; }
    .tags { margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { background: #eef; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; }
    .abstract-container { font-size: 0.9em; color: #444; margin: 4px 0; }
    .toggle-abstract { background: none; border: none; color: #007BFF; cursor: pointer; font-size: 0.9em; padding: 0; margin-left: 4px; }
    .toggle-abstract:hover { text-decoration: underline; }
    .result-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .sort-group { display: flex; align-items: center; gap: 5px; }
    details { margin-bottom: 20px; }
    summary { font-weight: bold; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .charts-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; }
    .chart-box { flex: 1 1 300px; min-width: 280px; }
    mark { background-color: #fff3b0; padding: 0 2px; }
    .chart-mode-toggle { display: flex; gap: 5px; margin-left: 15px; align-items: center; font-size: 0.9em; }
    .chart-mode-toggle button { padding: 3px 10px; border: 1px solid #aaa; background: #f5f5f5; cursor: pointer; border-radius: 3px; }
    .chart-mode-toggle button.active { background: #007BFF; color: white; border-color: #007BFF; }
    .stats-toggle-btn { font-size: 0.9em; padding: 2px 10px; margin-left: auto; cursor: pointer; }
    #loading { text-align: center; padding: 20px; font-size: 1.2em; color: #888; }
    .export-btn { background: #28a745; color: white; border: none; padding: 4px 12px; border-radius: 3px; cursor: pointer; }
    .export-btn:hover { background: #218838; }

    /* Checkbox group styles */
    .checkbox-group {
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px;
      background: #fafafa;
      min-width: 160px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: normal;
      font-size: 0.85em;
      margin-bottom: 2px;
      cursor: pointer;
    }
    .checkbox-group label input { margin: 0; }
    .clear-checkboxes {
      font-size: 0.75em;
      color: #007BFF;
      cursor: pointer;
      margin-top: 4px;
      display: inline-block;
    }
    .clear-checkboxes:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>可靠性与精度保持性文献库</h1>

  <div id="loading">加载中…</div>

  <div class="filters" id="filterContainer" style="display:none;">
    <div class="filter-group">
      <label for="cat1">文献类别</label>
      <select id="cat1">
        <option value="">全部</option>
        <option value="专利">专利</option>
        <option value="期刊文献">期刊文献</option>
        <option value="学位论文">学位论文</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="mainTech">技术大类</label>
      <select id="mainTech">
        <option value="">全部</option>
        <option value="可靠性">可靠性</option>
        <option value="精度保持性">精度保持性</option>
      </select>
    </div>
    <div class="filter-group">
      <label>技术子类</label>
      <div class="checkbox-group" id="subTechCheckboxes">
        <!-- populated dynamically -->
      </div>
      <span class="clear-checkboxes" id="clearTechChecks">清除选择</span>
    </div>
    <div class="filter-group">
      <label for="mainObj">对象大类</label>
      <select id="mainObj">
        <option value="">全部</option>
        <option value="整机">整机</option>
        <option value="子系统">子系统</option>
        <option value="功能部件">功能部件</option>
        <option value="零件和刀具">零件和刀具</option>
      </select>
    </div>
    <div class="filter-group">
      <label>对象子类</label>
      <div class="checkbox-group" id="subObjCheckboxes">
        <!-- populated dynamically -->
      </div>
      <span class="clear-checkboxes" id="clearObjChecks">清除选择</span>
    </div>
    <div class="filter-group">
      <label for="searchText">搜索（标题/作者/关键词/摘要）</label>
      <input type="text" id="searchText" placeholder="例如：刀库">
    </div>
    <div class="button-row">
      <button id="resetBtn">🔄 重置全部</button>
      <button id="exportBtn" class="export-btn">📥 导出当前结果</button>
    </div>
  </div>

  <details id="statsPanel" style="display:none;">
    <summary>
      📊 文献统计分析
      <button class="stats-toggle-btn" id="statsToggleBtn">显示统计</button>
    </summary>
    <div class="charts-container">
      <div class="chart-box" id="techChartBox"><canvas id="techChart" width="400" height="300"></canvas></div>
      <div class="chart-box" id="typeChartBox"><canvas id="typeChart" width="400" height="300"></canvas></div>
      <div class="chart-box" id="yearChartBox"><canvas id="yearChart" width="400" height="300"></canvas></div>
    </div>
    <div class="chart-mode-toggle" id="chartToggle" style="margin-top:10px; justify-content: flex-end;">
      <button id="btnAll" class="active">全部数据</button>
      <button id="btnFiltered">当前筛选</button>
    </div>
  </details>

  <div class="result-bar" id="resultBar" style="display:none;">
    <div id="resultCount"></div>
    <div class="sort-group">
      <label for="sortSelect">排序：</label>
      <select id="sortSelect">
        <option value="">默认</option>
        <option value="titleAsc">题名 A → Z</option>
        <option value="titleDesc">题名 Z → A</option>
        <option value="authorAsc">作者 A → Z</option>
        <option value="dateDesc">发表时间 新 → 旧</option>
        <option value="dateAsc">发表时间 旧 → 新</option>
      </select>
    </div>
  </div>

  <ul id="results"></ul>

  <script>
    // ---------- Hierarchy maps ----------
    const techSubMap = {
      "可靠性": ["可靠性试验", "早期故障", "载荷谱", "可靠性预计与分配", "可靠性管理", "装配可靠性", "可靠性评估", "失效和故障分析", "可靠性增长", "剩余寿命预测", "制造工艺可靠性", "维修维护"],
      "精度保持性": ["精度保持性试验与评估", "精度退化建模与预测", "摩擦磨损", "应力应变", "误差传递与建模", "装配技术与精度", "结合面", "精度保持性评估"]
    };
    const objSubMap = {
      "整机": ["车床和车铣复合", "加工中心", "镗床", "磨床", "五轴", "龙门", "特种机床"],
      "子系统": ["进给系统", "润滑系统", "冷却系统"],
      "功能部件": ["丝杠", "导轨", "刀架", "刀库和自动交换装置", "电主轴", "机械主轴", "转台", "摆角头", "排屑器"],
      "零件和刀具": ["轴承", "编码器", "刀具", "基础大件"]
    };

    let papers = [];
    let statisticsData = null;
    let chartInstances = {};
    let currentFilteredPapers = [];
    let chartMode = 'all';
    let chartsDrawn = false;
    let searchDebounceTimer = null;

    // ---------- Safe HTML escape & highlighting ----------
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightText(txt, term) {
      if (!txt) return '';
      const safe = escapeHtml(txt);
      if (!term) return safe;
      const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escapedTerm})`, 'gi'), '<mark>$1</mark>');
    }

    // ---------- Helper: read checked checkboxes from a container ----------
    function getCheckedValues(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return [];
      const checks = container.querySelectorAll('input[type="checkbox"]:checked');
      return Array.from(checks).map(cb => cb.value);
    }

    // ---------- Populate checkbox groups when main category changes ----------
    function populateCheckboxes(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!items || items.length === 0) {
        container.innerHTML = '<span style="color:#999;">（先选大类）</span>';
        return;
      }
      items.forEach(item => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
        container.appendChild(label);
      });
    }

    // ---------- Load data ----------
    Promise.all([
      fetch('data.json').then(res => res.json()),
      fetch('statistics.json').then(res => res.json()).catch(() => null)
    ])
    .then(([data, stats]) => {
      papers = data;
      statisticsData = stats;
      currentFilteredPapers = [...papers];

      document.getElementById('loading').style.display = 'none';
      document.getElementById('filterContainer').style.display = 'flex';
      document.getElementById('resultBar').style.display = 'flex';
      document.getElementById('statsPanel').style.display = '';

      // initial checkbox populate (empty)
      populateCheckboxes('subTechCheckboxes', []);
      populateCheckboxes('subObjCheckboxes', []);

      applyFiltersAndRender();
    })
    .catch(err => {
      document.getElementById('loading').innerHTML = '❌ 无法加载 data.json，请确保文件存在于同一目录下。';
      console.error(err);
    });

    // ---------- Main category change → update checkboxes ----------
    document.getElementById('mainTech').addEventListener('change', function() {
      const mainVal = this.value;
      if (mainVal && techSubMap[mainVal]) {
        populateCheckboxes('subTechCheckboxes', techSubMap[mainVal]);
      } else {
        populateCheckboxes('subTechCheckboxes', []);
      }
      applyFiltersAndRender();
    });

    document.getElementById('mainObj').addEventListener('change', function() {
      const mainVal = this.value;
      if (mainVal && objSubMap[mainVal]) {
        populateCheckboxes('subObjCheckboxes', objSubMap[mainVal]);
      } else {
        populateCheckboxes('subObjCheckboxes', []);
      }
      applyFiltersAndRender();
    });

    // Checkbox changes trigger filter update
    document.getElementById('subTechCheckboxes').addEventListener('change', applyFiltersAndRender);
    document.getElementById('subObjCheckboxes').addEventListener('change', applyFiltersAndRender);

    // Clear checkbox links
    document.getElementById('clearTechChecks').addEventListener('click', function() {
      document.querySelectorAll('#subTechCheckboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
      applyFiltersAndRender();
    });
    document.getElementById('clearObjChecks').addEventListener('click', function() {
      document.querySelectorAll('#subObjCheckboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
      applyFiltersAndRender();
    });

    // Debounced search input
    document.getElementById('searchText').addEventListener('input', function() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(applyFiltersAndRender, 300);
    });

    document.getElementById('cat1').addEventListener('change', applyFiltersAndRender);
    document.getElementById('sortSelect').addEventListener('change', applyFiltersAndRender);

    // Reset button
    document.getElementById('resetBtn').addEventListener('click', function() {
      document.getElementById('cat1').value = '';
      document.getElementById('mainTech').value = '';
      populateCheckboxes('subTechCheckboxes', []);
      document.getElementById('mainObj').value = '';
      populateCheckboxes('subObjCheckboxes', []);
      document.getElementById('searchText').value = '';
      document.getElementById('sortSelect').value = '';
      applyFiltersAndRender();
    });

    // Export button
    document.getElementById('exportBtn').addEventListener('click', function() {
      if (currentFilteredPapers.length === 0) {
        alert('没有可导出的文献。');
        return;
      }
      const headers = ['题名', '作者', '来源库', '单位', '文献来源', '关键词', '摘要', '发表时间', '文献类别', '技术', '对象'];
      const rows = currentFilteredPapers.map(p => [
        p['题名'] || '', p['作者'] || '', p['SrcDatabase-来源库'] || '', p['Organ-单位'] || '',
        p['Source-文献来源'] || '', p['Keyword-关键词'] || '', p['Summary-摘要'] || '',
        p['PubTime-发表时间'] || '', p['文献类别'] || '',
        (Array.isArray(p['技术']) ? p['技术'].join(';') : ''),
        (Array.isArray(p['对象']) ? p['对象'].join(';') : '')
      ].map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(','));
      
      const csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `文献导出_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Chart mode toggle
    document.getElementById('btnAll').addEventListener('click', function() {
      if (chartMode === 'all') return;
      chartMode = 'all';
      document.getElementById('btnAll').classList.add('active');
      document.getElementById('btnFiltered').classList.remove('active');
      if (document.getElementById('statsPanel').open) updateCharts();
    });
    document.getElementById('btnFiltered').addEventListener('click', function() {
      if (chartMode === 'filtered') return;
      chartMode = 'filtered';
      document.getElementById('btnFiltered').classList.add('active');
      document.getElementById('btnAll').classList.remove('active');
      if (document.getElementById('statsPanel').open) updateCharts();
    });

    // Lazy chart drawing
    const statsPanel = document.getElementById('statsPanel');
    statsPanel.addEventListener('toggle', function() {
      const toggleBtn = document.getElementById('statsToggleBtn');
      if (statsPanel.open) {
        toggleBtn.textContent = '隐藏统计';
        if (!chartsDrawn) {
          updateCharts();
          chartsDrawn = true;
        } else {
          updateCharts();
        }
      } else {
        toggleBtn.textContent = '显示统计';
      }
    });
    document.getElementById('statsToggleBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      statsPanel.open = !statsPanel.open;
    });

    // ---------- Single listener for abstract toggle ----------
    document.getElementById('results').addEventListener('click', function(e) {
      if (e.target.classList.contains('toggle-abstract')) {
        const btn = e.target;
        const container = btn.parentElement;
        const short = container.querySelector('.abstract-short');
        const full = container.querySelector('.abstract-full');
        if (full.style.display === 'none') {
          short.style.display = 'none';
          full.style.display = 'inline';
          btn.textContent = '收起';
        } else {
          short.style.display = 'inline';
          full.style.display = 'none';
          btn.textContent = '展开';
        }
      }
    });

    // ---------- Filtering & sorting ----------
    function applyFiltersAndRender() {
      const cat1 = document.getElementById('cat1').value;
      const mainTech = document.getElementById('mainTech').value;
      const mainObj = document.getElementById('mainObj').value;
      const text = document.getElementById('searchText').value.toLowerCase().trim();
      const sortBy = document.getElementById('sortSelect').value;

      // Read checked sub‑category values
      const selectedSubTechs = getCheckedValues('subTechCheckboxes');
      const selectedSubObjs = getCheckedValues('subObjCheckboxes');

      let filtered = papers.filter(p => {
        if (cat1 && p['文献类别'] !== cat1) return false;

        const paperTechs = Array.isArray(p['技术']) ? p['技术'] : [];
        // Main tech: if no subTechs checked, require at least one leaf of the main category
        if (mainTech && selectedSubTechs.length === 0) {
          const allowedLeaves = techSubMap[mainTech] || [];
          if (!paperTechs.some(t => allowedLeaves.includes(t))) return false;
        }
        // If subTechs are checked, paper must have at least one of them
        if (selectedSubTechs.length > 0) {
          if (!paperTechs.some(t => selectedSubTechs.includes(t))) return false;
        }

        const paperObjs = Array.isArray(p['对象']) ? p['对象'] : [];
        if (mainObj && selectedSubObjs.length === 0) {
          const allowedLeaves = objSubMap[mainObj] || [];
          if (!paperObjs.some(o => allowedLeaves.includes(o))) return false;
        }
        if (selectedSubObjs.length > 0) {
          if (!paperObjs.some(o => selectedSubObjs.includes(o))) return false;
        }

        if (text) {
          const title = (p['题名'] || '').toLowerCase();
          const author = (p['作者'] || '').toLowerCase();
          const keywords = (p['Keyword-关键词'] || '').toLowerCase();
          const abstract = (p['Summary-摘要'] || '').toLowerCase();
          if (!title.includes(text) && !author.includes(text) && !keywords.includes(text) && !abstract.includes(text)) {
            return false;
          }
        }
        return true;
      });

      let sorted = [...filtered];
      switch (sortBy) {
        case 'titleAsc': sorted.sort((a,b) => (a['题名']||'').localeCompare(b['题名']||'','zh')); break;
        case 'titleDesc': sorted.sort((a,b) => (b['题名']||'').localeCompare(a['题名']||'','zh')); break;
        case 'authorAsc': sorted.sort((a,b) => (a['作者']||'').localeCompare(b['作者']||'','zh')); break;
        case 'dateDesc':
          sorted.sort((a,b) => {
            const da = a['PubTime-发表时间'] || a['Year-年'] || '';
            const db = b['PubTime-发表时间'] || b['Year-年'] || '';
            return db.localeCompare(da);
          });
          break;
        case 'dateAsc':
          sorted.sort((a,b) => {
            const da = a['PubTime-发表时间'] || a['Year-年'] || '';
            const db = b['PubTime-发表时间'] || b['Year-年'] || '';
            return da.localeCompare(db);
          });
          break;
      }

      currentFilteredPapers = sorted;
      renderResults(sorted, text);
      if (statsPanel.open) updateCharts();
    }

    function renderResults(papersList, searchText) {
      document.getElementById('resultCount').textContent = `找到 ${papersList.length} 篇文献`;
      const resultsUl = document.getElementById('results');
      if (papersList.length === 0) {
        resultsUl.innerHTML = '<li>没有匹配的结果。</li>';
        return;
      }

      resultsUl.innerHTML = papersList.map(p => {
        const techTags = (Array.isArray(p['技术']) ? p['技术'] : []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
        const objTags = (Array.isArray(p['对象']) ? p['对象'] : []).map(o => `<span class="tag">${escapeHtml(o)}</span>`).join('');
        const abstractText = p['Summary-摘要'] || '';
        const safeAbstract = escapeHtml(abstractText);
        const shortAbstract = safeAbstract.length > 150 ? safeAbstract.substring(0, 150) + '...' : safeAbstract;
        const hasMore = safeAbstract.length > 150;

        return `
          <li class="paper">
            <h3>${highlightText(p['题名'] || '无标题', searchText)}</h3>
            <div class="meta">
              ${highlightText(p['作者'] || '', searchText)} · ${escapeHtml(p['SrcDatabase-来源库'] || '')} · ${escapeHtml(p['Source-文献来源'] || '')}
              ${p['PubTime-发表时间'] ? ' · ' + escapeHtml(p['PubTime-发表时间']) : ''}
              ${p['Keyword-关键词'] ? '<br>关键词：' + highlightText(p['Keyword-关键词'] || '', searchText) : ''}
            </div>
            <div class="abstract-container">
              <span class="abstract-short">${shortAbstract}</span>
              ${hasMore ? `<span class="abstract-full" style="display:none;">${safeAbstract}</span>
              <button class="toggle-abstract">展开</button>` : ''}
            </div>
            <div class="tags">${techTags}${objTags}</div>
          </li>
        `;
      }).join('');
    }

    // ---------- Chart drawing ----------
    function updateCharts() {
      Object.values(chartInstances).forEach(chart => { if (chart) chart.destroy(); });

      const dataArray = (chartMode === 'all') ? null : currentFilteredPapers;
      let hasData = (chartMode === 'all') ? (statisticsData !== null && papers.length > 0) : (currentFilteredPapers.length > 0);

      const boxes = [
        { boxId: 'techChartBox', canvasId: 'techChart' },
        { boxId: 'typeChartBox', canvasId: 'typeChart' },
        { boxId: 'yearChartBox', canvasId: 'yearChart' }
      ];

      if (!hasData) {
        boxes.forEach(({ boxId }) => { document.getElementById(boxId).innerHTML = '<p>当前无数据</p>'; });
        chartsDrawn = false;
        return;
      }

      boxes.forEach(({ boxId, canvasId }) => {
        document.getElementById(boxId).innerHTML = `<canvas id="${canvasId}" width="400" height="300"></canvas>`;
      });

      // 1. Tech bar
      let techData;
      if (chartMode === 'all' && statisticsData && statisticsData.techCounts) {
        techData = statisticsData.techCounts;
      } else {
        const counts = { '可靠性': 0, '精度保持性': 0 };
        currentFilteredPapers.forEach(p => {
          const tags = Array.isArray(p['技术']) ? p['技术'] : [];
          if (tags.some(t => techSubMap['可靠性'].includes(t))) counts['可靠性']++;
          if (tags.some(t => techSubMap['精度保持性'].includes(t))) counts['精度保持性']++;
        });
        techData = [counts['可靠性'], counts['精度保持性']];
      }
      chartInstances.techChart = new Chart(document.getElementById('techChart'), {
        type: 'bar',
        data: { labels: ['可靠性', '精度保持性'], datasets: [{ label: '文献数量', data: techData, backgroundColor: ['#4e79a7', '#f28e2b'] }] },
        options: { responsive: true, plugins: { title: { display: true, text: '技术大类分布（多标签重复计算）' } } }
      });

      // 2. Type pie
      let typeLabels, typeData;
      if (chartMode === 'all' && statisticsData && statisticsData.typeCounts) {
        typeLabels = Object.keys(statisticsData.typeCounts);
        typeData = Object.values(statisticsData.typeCounts);
      } else {
        const counts = {};
        currentFilteredPapers.forEach(p => {
          const t = p['文献类别'] || '未知';
          counts[t] = (counts[t] || 0) + 1;
        });
        typeLabels = Object.keys(counts);
        typeData = Object.values(counts);
      }
      chartInstances.typeChart = new Chart(document.getElementById('typeChart'), {
        type: 'pie',
        data: { labels: typeLabels, datasets: [{ data: typeData, backgroundColor: ['#e15759', '#76b7b2', '#59a14f', '#edc949'] }] },
        options: { responsive: true, plugins: { title: { display: true, text: '文献类别比例' } } }
      });

      // 3. Year bar
      let yearLabels, yearData;
      if (chartMode === 'all' && statisticsData && statisticsData.yearMap) {
        const yearMap = statisticsData.yearMap;
        yearLabels = Object.keys(yearMap).sort();
        yearData = yearLabels.map(y => yearMap[y]);
      } else {
        const yearMap = {};
        currentFilteredPapers.forEach(p => {
          const pub = p['PubTime-发表时间'];
          if (pub) {
            const match = String(pub).match(/^(\d{4})/);
            if (match) yearMap[match[1]] = (yearMap[match[1]] || 0) + 1;
          }
        });
        yearLabels = Object.keys(yearMap).sort();
        yearData = yearLabels.map(y => yearMap[y]);
      }
      if (yearLabels.length > 0) {
        chartInstances.yearChart = new Chart(document.getElementById('yearChart'), {
          type: 'bar',
          data: { labels: yearLabels, datasets: [{ label: '发表数量', data: yearData, backgroundColor: '#59a14f' }] },
          options: {
            responsive: true,
            plugins: { title: { display: true, text: '发表年份分布（根据PubTime提取）' } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      } else {
        document.getElementById('yearChartBox').innerHTML = '<p>当前数据集无年份数据</p>';
        chartInstances.yearChart = null;
      }
      chartsDrawn = true;
    }
  </script>
</body>
</html>
